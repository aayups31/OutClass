<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>OutClass</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <header>
      <svg
        class="logo"
        width="23"
        height="29"
        viewBox="0 0 48 48"
        fill="none"
        aria-hidden="true"
      >
        <path
          d="M37 24A14 14 0 1 1 24 10M24 24 38 10M29 10h9v9"
          stroke="currentColor"
          stroke-width="4.5"
          stroke-linecap="round"
          stroke-linejoin="round"
        />
      </svg>
      <strong>Out<span>Class</span></strong>
      <small>LEARNING COMPANION</small>
    </header>
    <div id="status">Connecting…</div>
    <section id="details"></section>
    <p id="pending"></p>
    <form id="pair-form">
      <div id="pairing" hidden>
        <label for="code">Connection code from Setup</label>
        <div class="pair-input">
          <input
            id="code"
            pattern="[0-9]{6}"
            maxlength="6"
            placeholder="000000"
            autocomplete="off"
          /><button type="submit">Connect</button>
        </div>
        <p class="hint">Find your code in the companion’s Setup page.</p>
      </div>
    </form>
    <p id="error" role="alert"></p>
    <button id="capture" class="primary">Capture this lesson</button>
    <form id="capture-preview" hidden>
      <label for="capture-title">Lesson title</label>
      <input id="capture-title" required maxlength="260" />
      <label for="capture-text">Material to save</label>
      <textarea id="capture-text" rows="6" maxlength="12000" placeholder="Leave blank to save the lesson link."></textarea>
      <label id="related-lessons-label" hidden><input id="related-lessons" type="checkbox" /> <span id="related-lessons-count"></span></label>
      <div class="capture-actions">
        <button class="primary" type="submit">Save in Learn</button>
        <button class="retry" id="cancel-capture" type="button">Cancel</button>
      </div>
    </form>
    <button id="open" class="primary">
      Open my workspace <span aria-hidden="true">↗</span>
    </button>
    <button id="retry" class="retry">Retry pending updates</button>
    <button id="transcript" class="retry">Import visible transcript</button>
    <p class="hint transcript-hint">You can select a passage before capturing. For Udemy transcripts, open the Transcript panel first.</p>
    <p id="transcript-status" role="status"></p>
    <script src="popup.js"></script>
  </body>
</html>
