name: Academy Windows release verification
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  installed-apps:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '24'
          cache: npm
      - run: |
          git config --global user.name 'OutClass Release Test'
          git config --global user.email 'release-test@outclass.invalid'
      - run: npm ci --ignore-scripts
      - run: npm run package:apps
      - run: pwsh -File scripts/test-release-installers.ps1
      - uses: actions/upload-artifact@v7.0.2
        if: always()
        with:
          name: windows-release-installers
          path: |
            dist/releases/learn/*Setup-*.exe
            dist/releases/educator/*Setup-*.exe
          retention-days: 14
