name: Academy engineering gates
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: academy-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    env:
      OPENAI_API_KEY: ""
      OPEN_AI_API: ""
      OUTCLASS_DATABASE_TEST: "0"
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: "24"
          cache: npm
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: "3.12"
      - run: npm ci --ignore-scripts
      - name: Configure disposable learning-history identity
        run: |
          git config --global user.name "OutClass CI"
          git config --global user.email "ci@outclass.invalid"
          git config --global init.defaultBranch main
      - name: Install media test runtime on Linux
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes ffmpeg
      - name: Install media test runtime on Windows
        if: runner.os == 'Windows'
        run: choco install ffmpeg --yes --no-progress
      - run: npm test
      - run: npm run build
      - run: npm run build:ai
      - run: npx tsx scripts/accept-course-workshop.ts --fixture
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test tests/e2e/course-workshop.spec.ts tests/e2e/expansion.spec.ts tests/e2e/agent-work.spec.ts
      - uses: actions/upload-artifact@v7.0.2
        if: failure()
        with:
          name: academy-failures-${{ matrix.os }}
          path: |
            playwright-report/
            test-results/
          retention-days: 7
