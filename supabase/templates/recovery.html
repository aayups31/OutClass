<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"></head>
<body style="margin:0;background:#f5f6ff;color:#17254e;font-family:Arial,sans-serif">
<div style="max-width:480px;margin:0 auto;padding:48px 24px">
<p style="font-size:14px;font-weight:bold;letter-spacing:2px">OUTCLASS</p>
<h1 style="font-size:28px;font-weight:600;margin:36px 0 18px">Reset your password.</h1>
<p style="color:#526181;line-height:1.7">Enter this code on the OutClass password reset page, then choose your new password.</p>
<p style="font-size:36px;font-weight:bold;letter-spacing:7px;margin:30px 0" aria-label="Password reset code">{{ .Token }}</p>
<p style="color:#526181;font-size:13px;line-height:1.7">Use the latest code. If you didn’t request this, ignore this email. Your password has not changed.</p>
</div></body></html>
